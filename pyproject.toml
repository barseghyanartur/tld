# ----------------------------------------------------------------------------
# Project metadata (PEP 621)
# ----------------------------------------------------------------------------
[project]
name = "tld"
version = "0.13.2"
description = "Extract the top-level domain (TLD) from the URL given."
readme = "README.rst"
requires-python = ">=3.9"
authors = [
    {name = "Artur Barseghyan", email = "artur.barseghyan@gmail.com"},
]
maintainers = [
    {name = "Artur Barseghyan", email = "artur.barseghyan@gmail.com"},
]
license = "MPL-1.1 OR GPL-2.0-only OR LGPL-2.1-or-later"
keywords = ["tld", "top-level domain names", "python"]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Development Status :: 5 - Production/Stable",
    "Topic :: Internet",
]
dependencies = []

[project.urls]
"Bug Tracker" = "https://github.com/barseghyanartur/tld/issues"
"Documentation" = "https://tld.readthedocs.io/"
"Source Code" = "https://github.com/barseghyanartur/tld/"
"Changelog" = "https://tld.readthedocs.io/en/latest/changelog.html"

[project.scripts]
"update-tld-names" = "tld.utils:update_tld_names_cli"

[project.optional-dependencies]
all = ["tld[build,lint,dev,test,docs]"]
build = [
    "build",
    "pkginfo",
    "twine",
    "wheel",
]
lint = [
    "doc8",
    "pydoclint",
    "ruff",
    "ty",
]
dev = [
    "detect-secrets",
    "ipython",
    "uv",
]
test = [
    "coverage",
    "fake.py",
    "pytest",
    "pytest-codeblock",
    "pytest-cov",
    "pytest-order",
    "tox",
]
docs = [
    "sphinx",
    "sphinx-autobuild",
    "sphinx-rtd-theme>=1.3.0",
    "sphinx-no-pragma",
    "sphinx-llms-txt-link",
    "sphinx-source-tree; python_version > '3.9'",
]

# ----------------------------------------------------------------------------
# Build system
# ----------------------------------------------------------------------------
[build-system]
requires = ["setuptools>=41.0", "setuptools-scm", "wheel"]
build-backend = "setuptools.build_meta"

# ----------------------------------------------------------------------------
# setuptools-specific packaging
# ----------------------------------------------------------------------------
[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["tld", "tld.*"]

[tool.setuptools.package-data]
"tld" = ["res/*", "tests/res/*"]

# ----------------------------------------------------------------------------
# Ruff configuration
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 80

# Enable Pyflakes `E` and `F` codes by default.
lint.select = [
#    "ANN",  # Annotations: missing (return) types
    "B",  # Bugbear: common bug patterns or design problems
    "C4",  # Complexity: McCabe complexity checker
    "E",  # Pycodesyle: Style guide enforcement
    "F",  # Pyflakes: Source files errors
    "G",  # Logging format: Basic logging format errors
    "I",  # Isort: import sorting
    "ISC",  # Naming: Variable naming convention
    "INP",  # Implicit namespace packages: Check if __init__.py is present
    "N",  # Naming: Variable naming convention
    "PERF",  # Perflint: Performance linting
    "Q",
    "SIM",  # Simplify: Helps simplify your code
    "TD",  # TO DO: Format TO DO comments
]
lint.ignore = [
    "G004",  # Allow use of f-string in logging
    "ISC003",  # Allow explicitly concatenated strings
#    "N805",  # Allow first argument of a method be named other than `self`
    "TD002",  # Allow to do without author
    "TD003",  # Allow to do without URL
]
# Enable autofix for formatting and import sorting
fix = true

# Exclude a variety of commonly ignored directories.
lint.exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".nox",
    ".pants.d",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "examples/gae/data.py",
]
lint.per-file-ignores = {}

# Allow unused variables when underscore-prefixed.
lint.dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

# Assume Python 3.10.
target-version = "py310"

# ----------------------------------------------------------------------------
# doc8 configuration
# ----------------------------------------------------------------------------
[tool.doc8]
ignore-path = [
    "docs/requirements.txt",
    "src/tld.egg-info/SOURCES.txt",
    "src/tld/res/",
    "build/",
    "docs/_build",
    "requirements/*.in",
    "requirements/*.txt",
    "src/tld.egg-info",
    "examples/custom_tld_names_source/res/*.txt",
    "src/tld/tests/res/*.txt",
]

max-line-length = 80
sphinx = true

# ----------------------------------------------------------------------------
# pytest configuration
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
addopts = [
    "-ra",
    "-vvv",
    "-q",
    "--cov=tld",
    "--ignore=.tox",
    "--ignore=requirements",
    "--ignore=release",
    "--ignore=bugs",
    "--ignore=tmp",
    "--ignore=tests",
    "--cov-report=html",
    "--cov-report=term",
    "--cov-report=annotate",
    "--cov-append",
    "--capture=no",
]
testpaths = [
#    "**/test*.py",
#    "**/*.rst",
]
python_files = [
    "test_*.py",
    "tests.py",
]
pythonpath = [
    "src",
    "examples/gae",
]
norecursedirs = [".git", "*.egg", ".tox", "build", "dist", ".tox"]

markers = [
    "slow: mark a test that takes a long time to run.",
    "codeblock: pytest-codeblock markers",
    "documentation: mark test as a documentation test",
]

# ----------------------------------------------------------------------------
# coverage configuration
# ----------------------------------------------------------------------------
[tool.coverage.run]
relative_files = true
omit = [
    ".tox/*",
    "src/tld/bench.py",
    "src/tld/tests/*",
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "@overload",
    "raise NotImplementedError",
]

# ----------------------------------------------------------------------------
# sphinx-source-tree configuration
# ----------------------------------------------------------------------------

[tool.sphinx-source-tree]
ignore = [
    "*.egg-info",
    "*.py,cover",
    "*.pyc",
    "*.pyo",
    ".DS_Store",
    ".coverage",
    ".coverage.*",
    ".git",
    ".hg",
    ".hypothesis",
    ".idea",
    ".nox",
    ".pre-commit-config.yaml",
    ".pre-commit-hooks.yaml",
    ".pytest_cache",
    ".readthedocs.yaml",
    ".ruff_cache",
    ".secrets.baseline",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "CHANGELOG.rst",
    "CODE_OF_CONDUCT.rst",
    "LICENSE",
    "SECURITY.rst",
    "Thumbs.db",
    "__pycache__",
    "build",
    "codebin",
    "dist",
    "docs/Makefile",
    "docs/_build",
    "docs/_static",
    "docs/changelog.rst",
    "docs/code_of_conduct.rst",
    "docs/contributor_guidelines.rst",
    "docs/documentation.rst",
    "docs/llms.rst",
    "docs/index.rst",
    "docs/make.bat",
    "docs/requirements.txt",
    "docs/security.rst",
    "docs/source_tree.rst",
    "docs/tld.rst",
    "env",
    "htmlcov",
    "node_modules",
    "venv",
    ".coveralls.yml",
    ".pth",
    "CODE_OF_CONDUCT.md",
    "CREDITS.rst",
    "jupyter",
    "SECURITY.md",
    "CREDITS.rst",
    "examples/custom_tld_names_source/res",
    "src/tld/res",
    "src/tld/tests/res",
    "runtests.py",
    "benchmarks",
    ".claude/settings.local.json",
    ".coderabbit.yaml",
    ".claude",
    "uv.lock",
]
order = [
    "README.rst",
    "CONTRIBUTING.rst",
]
